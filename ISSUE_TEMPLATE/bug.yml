name: Bug report
description: Something does not work as described.
labels: ["type: bug", "status: triage"]
body:
  - type: markdown
    attributes:
      value: Thanks for the report. Security issues go through SECURITY.md, not here.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. ...\n2. ...\n3. ..."
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: Browser and version, OS, extension or package version.
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      render: shell
