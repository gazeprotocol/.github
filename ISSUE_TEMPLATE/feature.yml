name: Feature request
description: Suggest an improvement to the protocol, tools or docs.
labels: ["type: feature", "status: triage"]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: Who is this for (watchers, creators, developers) and what is hard today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you propose
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
